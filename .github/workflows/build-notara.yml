# Notara 集成版 dsh-Go 的云端构建。
#
# 本地（国内网络）连不上 dl.google.com / plugins.gradle.org / Flutter CDN，Gradle 反复超时，
# 所以整条重活链——rootfs 组装 + APK 编译签名——全部放在 GitHub 官方的 ubuntu runner 上跑：
# 海外带宽直连上游源，16GB 内存，Android SDK / JDK 17 预装。
#
# 两个 job 拆开是因为它们的耗时差了一个数量级，而且 rootfs 只跟 runtime/ 与 Notara 的提交有关：
#   runtime  组装 rootfs（注入 Notara 插件、改 dsh-web.patch.yml、重算 manifest），产物缓存
#   apk      取 rootfs，签密钥，tooling/build-apk.sh -f arm64，上传 artifact + 发 Release
#
# 只改 Flutter UI 时 runtime 缓存命中，跳过 40 分钟的 rootfs，直接进 APK 编译。
name: Build Notara APK

on:
  workflow_dispatch:
    inputs:
      create_release:
        description: 构建成功后发一个 GitHub Release
        type: boolean
        default: true
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: notara-apk-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: 3.47.9
  NODE_VERSION: 24.22.1
  TZ: Asia/Shanghai
  # 云端用上游官方源：runner 在海外，镜像反而是绕路。sha256 pin 保证换个镜像也是同一批字节。
  UBUNTU_MIRROR: https://cdimage.ubuntu.com/ubuntu-base/releases/24.04/release
  NODE_MIRROR: https://nodejs.org/dist
  NPM_REGISTRY: https://registry.npmjs.org
  UBUNTU_ARCHIVE_AMD64: http://archive.ubuntu.com/ubuntu
  UBUNTU_ARCHIVE_ARM64: http://ports.ubuntu.com/ubuntu-ports
  # 干净的基础 rootfs：同一条链路全量 assemble 的产物，未叠加任何 overlay。
  # 走 API asset 端点（私有仓库的浏览器下载链接需要会话，API + token 两种都可用）。
  BASE_ROOTFS_URL: https://api.github.com/repos/moqing-study/dsh-Go/releases/assets/731729089
  BASE_ROOTFS_SHA256: e29b3660eac2517bcedb5934f82bb67265cfd37a02bd2aaa651fe7fec77f60d4
  # manifest 必须跟归档一起取:它记录的是这份归档的 sha256、字节数、入口与补丁
  # 清单,安装器逐项校验。单取归档不取 manifest,版本号和哈希就对不上。
  BASE_ROOTFS_MANIFEST_URL: https://api.github.com/repos/moqing-study/dsh-Go/releases/assets/731747705
  BASE_ROOTFS_MANIFEST_SHA256: b39af4f61e6c06bbb0956d693de462894cf99777f02d8664af00e68acba1e997
  # Notara 教学引擎：未发布到 npm，只能从源码取。钉死提交，保证可复现。
  NOTARA_REPO: https://github.com/TongZi2003/Notara.git
  NOTARA_REF: 09a73bb749fe1f452ca53acdbf73fcc4b9704692
  NOTARA_PLUGIN_SRC: examples/native-vault
  # 插件的 package.json 只声明了 10 个依赖，但源码还直接 import 了下面这些——它们在
  # Notara 的 monorepo 里靠 npm 提升才找得到，单独装这个包就会缺：
  #   index.js:15 急切引入 session-groups-runtime.js，后者顶层 import zod（缺了插件根本不加载）
  #   code-editor-client.js / live-preview.js / math-latex.js 是给 WebView 的客户端模块，
  #   白板代码编辑器和 LaTeX 渲染全靠 @codemirror/* 和 katex
  # 版本一律取自 Notara 自己的 package-lock.json，不在这里手写。
  NOTARA_PLUGIN_EXTRA_DEPS: >-
    zod katex @codemirror/state @codemirror/view @codemirror/language
    @codemirror/commands @codemirror/autocomplete @codemirror/lang-markdown
    @codemirror/lang-javascript @codemirror/lang-python @codemirror/legacy-modes

jobs:
  runtime:
    name: Runtime rootfs (arm64)
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      # 标准 runner 只有 14GB 空盘，rootfs 的工作目录 + xz 归档 + Gradle 缓存会顶到边。
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android/sdk/ndk /opt/ghc /usr/local/share/boost \
                      "$AGENT_TOOLSDIRECTORY" 2>/dev/null || true
          sudo apt-get clean
          df -h /

      - name: Host tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq xz-utils file gpgv

      # 宿主调用的每个网页方法、每条 postMessage type,都必须两边对得上。
      # 放在最前面:契约错了就 30 秒内失败,不用等 40 分钟的 rootfs。
      - name: Check the host/bridge contract
        run: python3 runtime/notara-overlay/check-contract.py

      - name: Cache runtime downloads
        uses: actions/cache@v4
        with:
          path: runtime/.cache
          key: runtime-cache-${{ env.NOTARA_REF }}-${{ hashFiles('runtime/locks/**') }}
          restore-keys: runtime-cache-${{ env.NOTARA_REF }}-

      # rootfs 是可复现的（SOURCE_DATE_EPOCH 固定、依赖全部 pin 死），所以按配方内容做键。
      #
      # 键里**不含 workflow 文件**：否则改一行 CI 就让 177MB 的基础 rootfs 作废，
      # 而这一版真正要变的只是插件前端（见 runtime/notara-overlay）。
      # `restore-keys` 是第二道保险：键对不上时取最近的一份同源 rootfs，
      # 再用 overlay 把改过的插件与教学预设覆盖进去。
      - name: Restore the built rootfs
        id: rootfs
        uses: actions/cache/restore@v4
        with:
          path: |
            runtime/out/arm64-v8a
            runtime/out/manifest.json
          key: rootfs-arm64-v2-${{ env.NOTARA_REF }}-${{ hashFiles('runtime/build-runtime.sh', 'runtime/lib/rtbuild.py', 'runtime/patches/**', 'runtime/bridge/**', 'runtime/boot/**', 'runtime/direct/**') }}-${{ hashFiles('runtime/notara-overlay/**') }}
          restore-keys: |
            rootfs-arm64-v2-${{ env.NOTARA_REF }}-

      # 缓存命中与否只看"归档在不在"，不看 actions/cache 的 cache-hit：
      # restore-keys 命中也算可用（随后由 overlay 补齐改动）。
      - name: Do we already have a base rootfs?
        id: base
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          archive=runtime/out/arm64-v8a/assets/runtime/rootfs-arm64-v8a.tar.xz
          if [[ -s "$archive" ]]; then
            echo "have=1" >> "$GITHUB_OUTPUT"
            echo "base rootfs (cache): $(du -h "$archive" | cut -f1)"
            exit 0
          fi
          # 缓存里没有就走预置归档。上游 Ubuntu 会在新版进池后立刻删掉被取代的
          # .deb，索引与本机缓存也会偶发不一致，全量组装因此不是每次都能跑通
          # （2026-11-10 那次就死在 ca-certificates 上）。这份归档是同一条链路
          # 全量组装出来的干净产物：81645 条目、0 硬链接、client.js 与上游仓库
          # 逐字节一致、patch 里没有任何 overlay 块。sha256 钉死，先校验再用。
          if [[ -n "${BASE_ROOTFS_URL:-}" ]]; then
            mkdir -p "$(dirname "$archive")"
            echo "downloading prebuilt base: $BASE_ROOTFS_URL"
            # 私有仓库的 release 资源必须走 API 端点并带上 token；Accept 头让它
            # 直接回二进制，而不是一段 JSON 元数据。
            if curl -fL --retry 3 --retry-delay 3 --connect-timeout 20 -sS \
                 -H "Authorization: Bearer $GITHUB_TOKEN" \
                 -H "Accept: application/octet-stream" \
                 -o "$archive.part" "$BASE_ROOTFS_URL"; then
              echo "${BASE_ROOTFS_SHA256}  $archive.part" | sha256sum -c -
              mv "$archive.part" "$archive"
              manifest="$(dirname "$archive")/manifest.json"
              echo "downloading the matching manifest"
              curl -fL --retry 3 --retry-delay 3 --connect-timeout 20 -sS \
                -H "Authorization: Bearer $GITHUB_TOKEN" \
                -H "Accept: application/octet-stream" \
                -o "$manifest.part" "$BASE_ROOTFS_MANIFEST_URL"
              echo "${BASE_ROOTFS_MANIFEST_SHA256}  $manifest.part" | sha256sum -c -
              mv "$manifest.part" "$manifest"
              python3 - "$archive" <<'PY'
          import hashlib, json, os, sys
          archive = sys.argv[1]
          manifest = os.path.join(os.path.dirname(archive), "manifest.json")
          digest = hashlib.sha256()
          with open(archive, "rb") as fh:
              for chunk in iter(lambda: fh.read(1 << 20), b""):
                  digest.update(chunk)
          if os.path.exists(manifest):
              data = json.load(open(manifest, encoding="utf-8"))
          else:
              data = {}
          data["rootfsBytes"] = os.path.getsize(archive)
          data["rootfsSha256"] = digest.hexdigest()
          with open(manifest, "w", encoding="utf-8") as fh:
              json.dump(data, fh, ensure_ascii=False, indent=2, sort_keys=True)
              fh.write("\n")
          print("manifest pinned to the downloaded base:", data.get("runtimeVersion"))
          PY
              echo "base rootfs (prebuilt): $(du -h "$archive" | cut -f1)"
              echo "have=1" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            rm -f "$archive.part"
            echo "prebuilt base unavailable, falling back to a full assemble"
          fi
          echo "have=0" >> "$GITHUB_OUTPUT"

      - name: Fetch the Notara teaching engine
        if: steps.base.outputs.have != '1'
        run: |
          set -euo pipefail
          git init -q notara && cd notara
          git remote add origin "$NOTARA_REPO"
          # 只取需要的那个提交；--depth 1 对任意 sha 不生效，所以先浅取全部分支再 fetch 目标
          git fetch -q --depth 1 origin "$NOTARA_REF"
          git checkout -q FETCH_HEAD
          echo "Notara commit: $(git rev-parse HEAD)"

      - name: Stage the plugin and install its arm64 dependencies
        if: steps.base.outputs.have != '1'
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/plugin"
          # 插件是 Notara 仓库里的一个 workspace 包，源码就是最终产物（不用编译），
          # package.json 里 10 个依赖都写死了版本，没有 workspace: 协议，可以独立装。
          cp -a "notara/$NOTARA_PLUGIN_SRC/." "$RUNNER_TEMP/plugin/"
          rm -f "$RUNNER_TEMP"/plugin/*.test.js

          # 未被声明、但源码真的 import 了的包，版本从 Notara 的 lock 里取
          python3 - <<'PY' > "$RUNNER_TEMP/extra.txt"
          import json, os
          lock = json.load(open("notara/package-lock.json", encoding="utf-8"))
          packages = lock.get("packages") or {}
          for name in os.environ["NOTARA_PLUGIN_EXTRA_DEPS"].split():
              version = (packages.get("node_modules/" + name) or {}).get("version")
              # 一列包名、一列 install 参数：名字里本身带 @，不能在 shell 里切
              print("%s\t%s" % (name, name + "@" + version if version else name))
          PY
          echo "--- 额外依赖 ---"; cat "$RUNNER_TEMP/extra.txt"

          cd "$RUNNER_TEMP/plugin"
          # --os/--cpu/--libc：在 x64 runner 上装出 arm64 Android 能用的树（原生 .node 必须是 aarch64）
          # --no-save：不改 package.json，只把树装全
          mapfile -t specs < <(cut -f2 "$RUNNER_TEMP/extra.txt")
          npm install --ignore-scripts --no-audit --no-fund --engine-strict=false \
            --os=linux --cpu=arm64 --libc=glibc --omit=dev --no-save "${specs[@]}"
          echo "packages: $(ls node_modules | wc -l), size: $(du -sh node_modules | cut -f1)"

          # 缺一个，插件就是加载不了或白板没有 LaTeX，这里先拦住
          missing=0
          while IFS=$'\t' read -r name spec; do
            [[ -d "node_modules/$name" ]] || { echo "MISSING: $name ($spec)"; missing=1; }
          done < "$RUNNER_TEMP/extra.txt"
          [[ $missing == 0 ]] || exit 1

          # 装出来的原生模块必须是 aarch64，否则装进手机也跑不起来
          bad=0
          while IFS= read -r f; do
            file -b "$f" | grep -q aarch64 || { echo "not arm64: $f ($(file -b "$f"))"; bad=1; }
          done < <(find node_modules -name '*.node' -type f)
          [[ $bad == 0 ]] || exit 1
          echo "plugin: $(du -sh . | cut -f1)"

      - name: Assemble the rootfs
        if: steps.base.outputs.have != '1'
        env:
          EXTRA_PLUGINS: notara-vault-native=${{ runner.temp }}/plugin
          XZ_THREADS: 4
        run: |
          set -euo pipefail
          bash runtime/build-runtime.sh arm64-v8a
          echo "--- result ---"
          ls -lh runtime/out/arm64-v8a/assets/runtime/
          python3 - <<'PY'
          import json
          m = json.load(open("runtime/out/arm64-v8a/assets/runtime/manifest.json"))
          print("runtimeVersion:", m["runtimeVersion"])
          print("rootfs:", m["rootfs"], m["rootfsBytes"], "bytes")
          print("extraPlugins:", m.get("extraPlugins"))
          PY

      # 只改插件前端时走这条路：解包 → 覆盖插件与教学预设 → 重算版本与哈希 → 重打。
      # 大约 8–12 分钟，比全量组装快一个数量级。
      #
      # 缓存只有键完全一致时才跳过它——那说明这一版 overlay 已经打进去了。
      # 其余情况（全量组装、或用旧 base 拼出来的）都要跑：插件此时来自上游
      # 仓库或旧归档，都不含这一版改动。
      - name: Apply the Notara overlay to the rootfs
        if: steps.rootfs.outputs.cache-hit != 'true'
        env:
          XZ_THREADS: 4
        run: |
          set -euo pipefail
          dir=runtime/out/arm64-v8a/assets/runtime
          work="$dir/rootfs-arm64-v8a.tar.xz"
          base="$dir/rootfs-base.tar.xz"
          # 每次都从**干净输入**出发，绝不在上一次的输出上叠加。
          # 上一轮就是在这里翻的：缓存里存的是 overlay 之后的产物，而那份产物
          # 本身是畸形归档（每个文件后跟两条自指硬链接）。再叠一层救不回来，
          # 只能把缓存键整个作废重跑 40 分钟。留下 base 之后，坏输出再也不会
          # 污染下一轮——它每次都被 base 覆盖掉。
          if [[ -s "$base" ]]; then
            echo "starting from the preserved clean base"
            cp -f "$base" "$work"
          else
            echo "first run on this base: keeping a copy as the clean input"
            cp -f "$work" "$base"
          fi
          python3 runtime/notara-overlay/apply.py \
            --rootfs "$work" \
            --manifest "$dir/manifest.json"

      - name: Check the plugin really made it into the rootfs
        run: |
          set -euo pipefail
          archive=runtime/out/arm64-v8a/assets/runtime/rootfs-arm64-v8a.tar.xz
          tar -tJf "$archive" \
            | grep -E '^\.?/?opt/dsh-go/plugins/notara-vault-native/(index\.js|package\.json)$'
          echo "--- 改动必须真的在归档里，否则就是拿旧插件骗自己 ---"
          work=$(mktemp -d)
          # overlay 重打的归档成员名带 "./" 前缀(它把 "." 交给 tar 递归),
          # 而全量组装的归档不带。按字面路径提取会在其中一种上静默失败,
          # 所以用 tarfile 归一化后再取。
          python3 - "$archive" "$work" <<'PY'
          import sys, tarfile
          archive, work = sys.argv[1], sys.argv[2]
          want = {
              "opt/dsh-go/plugins/notara-vault-native/client.js",
              "etc/dsh-app/dsh-web.patch.yml",
          }
          got = set()
          with tarfile.open(archive, "r:xz") as tar:
              for member in tar:
                  name = member.name[2:] if member.name.startswith("./") else member.name
                  if name in want:
                      tar.extract(member, work)
                      got.add(name)
          missing = want - got
          if missing:
              sys.exit("archive is missing: %s" % ", ".join(sorted(missing)))
          print("extracted:", ", ".join(sorted(got)))
          PY
          for needle in __NOTARA_DIRECT__ openLessonView data-nv-view nv-class-views; do
            grep -q "$needle" "$work/opt/dsh-go/plugins/notara-vault-native/client.js" \
              || { echo "MISSING $needle in client.js"; exit 1; }
          done
          for needle in preset-notara-teacher agent-preset-registry; do
            grep -q "$needle" "$work/etc/dsh-app/dsh-web.patch.yml" \
              || { echo "MISSING $needle in dsh-web.patch.yml"; exit 1; }
          done
          echo "--- manifest 里必须写着这个版本 ---"
          grep -o '"runtimeVersion": *"[^"]*"' runtime/out/arm64-v8a/assets/runtime/manifest.json
          grep -o '"extraPlugins":[^]]*]' runtime/out/arm64-v8a/assets/runtime/manifest.json || true

      # 预置 base / 缓存命中都只带来 rootfs+manifest,不带 Termux 二进制。
      # 没有这一步,APK 里就没有 libproot.so,引擎启动直接 error=2
      # (2026-11-10 的 nvcca13895 就是这么坏的:manifest 里有校验和,文件不在)。
      # --jni-only 只补 jniLibs,不动 assets,并逐字节核对 manifest 里的 sha256。
      - name: Build the jniLibs (proot & friends)
        if: steps.base.outputs.have == '1'
        run: |
          set -euo pipefail
          bash runtime/build-runtime.sh arm64-v8a --jni-only
          ls -l runtime/out/arm64-v8a/jniLibs/arm64-v8a/

      # 把这次组装/改写后的 rootfs 存回去：下一次命中就是这一版。
      - name: Save the rootfs
        if: steps.rootfs.outputs.cache-hit != 'true'
        # 同一个 key 已经存在时 cache/save 会失败。缓存只是加速手段,不该让
        # 一个已经打好的 APK 因为"存缓存没成功"而作废。
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: |
            runtime/out/arm64-v8a
            runtime/out/manifest.json
          key: rootfs-arm64-v2-${{ env.NOTARA_REF }}-${{ hashFiles('runtime/build-runtime.sh', 'runtime/lib/rtbuild.py', 'runtime/patches/**', 'runtime/bridge/**', 'runtime/boot/**', 'runtime/direct/**') }}-${{ hashFiles('runtime/notara-overlay/**') }}

      - name: Upload the rootfs
        uses: actions/upload-artifact@v4
        with:
          name: runtime-arm64
          path: |
            runtime/out/arm64-v8a
            !runtime/out/arm64-v8a/assets/runtime/rootfs-base.tar.xz
            runtime/out/manifest.json
          retention-days: 14
          compression-level: 0

  apk:
    name: APK (arm64, release, signed)
    needs: runtime
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      DSH_MAVEN_MIRRORS: 0
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost 2>/dev/null || true
          df -h /

      - uses: actions/download-artifact@v4
        with:
          name: runtime-arm64
          path: runtime/out

      - name: Restore the coexist keystore
        env:
          KEYSTORE_B64: ${{ secrets.NOTARA_COEXIST_KEYSTORE_B64 }}
          STORE_PASSWORD: ${{ secrets.NOTARA_COEXIST_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.NOTARA_COEXIST_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.NOTARA_COEXIST_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "$KEYSTORE_B64" ]]; then
            echo "Secret NOTARA_COEXIST_KEYSTORE_B64 is not set — cannot sign the coexist APK"; exit 1
          fi
          printf '%s' "$KEYSTORE_B64" | base64 -d > app/android/notara-coexist.jks
          chmod 600 app/android/notara-coexist.jks
          # Gradle 从 app/android/app/ 解析这个相对路径，指向 app/android/notara-coexist.jks
          {
            echo "storeFile=../notara-coexist.jks"
            echo "storePassword=$STORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > app/android/key.properties
          chmod 600 app/android/key.properties
          keytool -list -keystore app/android/notara-coexist.jks -storepass "$STORE_PASSWORD" \
            -alias "$KEY_ALIAS" | sed -n '1,6p'

      - name: Cache Gradle and pub
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.pub-cache
          key: gradle-${{ env.FLUTTER_VERSION }}-${{ hashFiles('app/pubspec.lock', 'app/android/**/*.kts', 'app/android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ env.FLUTTER_VERSION }}-

      - name: Flutter dependencies
        working-directory: app
        run: |
          flutter pub get --enforce-lockfile
          printf 'sdk.dir=%s\nflutter.sdk=%s\n' "$ANDROID_HOME" "$FLUTTER_ROOT" > android/local.properties

      - name: Build the signed APK
        run: |
          set -euo pipefail
          echo "rootfs in place: $(du -sh runtime/out/arm64-v8a | cut -f1)"
          bash tooling/build-apk.sh -f arm64 --keep-daemon
          ls -lh app/build/app/outputs/flutter-apk/

      - name: Rename for the release
        id: apk
        run: |
          set -euo pipefail
          src=app/build/app/outputs/flutter-apk/app-arm64-release.apk
          [[ -f $src ]] || { echo "no APK at $src"; ls -R app/build/app/outputs || true; exit 1; }
          version=$(sed -n 's/^version:[[:space:]]*\([^+[:space:]]*\).*/\1/p' app/pubspec.yaml)
          out="dsh-go-notara-${version}-arm64.apk"
          cp "$src" "$out"
          echo "size=$(du -h "$out" | cut -f1)" >> "$GITHUB_OUTPUT"
          echo "name=$out" >> "$GITHUB_OUTPUT"
          echo "$out  ($(du -h "$out" | cut -f1))"

      - name: Verify the signature scheme and the bundled runtime
        run: |
          set -euo pipefail
          apk="${{ steps.apk.outputs.name }}"
          apksigner=$(ls -1d "$ANDROID_HOME"/build-tools/*/apksigner 2>/dev/null | sort -V | tail -1)
          "$apksigner" verify --print-certs "$apk" | sed -n '1,8p'
          unzip -l "$apk" | grep -E 'assets/runtime/(rootfs|manifest)' || true
          # nvcca13895 那版翻车点:rootfs 一切正常,但 APK 里没有 libproot.so,
          # 手机上引擎直接 error=2。存在性 + 与包内 manifest 的 sha256 都钉死。
          for n in libproot.so libproot-loader.so libtalloc.so libandroid-shmem.so; do
            unzip -l "$apk" "lib/arm64-v8a/$n" >/dev/null \
              || { echo "MISSING lib/arm64-v8a/$n —— proot 起不来"; exit 1; }
          done
          python3 - "$apk" <<'PY'
          import hashlib, json, subprocess, sys
          apk = sys.argv[1]
          manifest = json.loads(subprocess.run(["unzip", "-p", apk, "assets/runtime/manifest.json"],
                                               capture_output=True, check=True).stdout)
          expect = manifest.get("jniLibs") or {}
          assert expect, "manifest has no jniLibs section"
          for name, meta in sorted(expect.items()):
              blob = subprocess.run(["unzip", "-p", apk, "lib/arm64-v8a/" + name],
                                    capture_output=True, check=True).stdout
              got = hashlib.sha256(blob).hexdigest()
              assert got == str(meta["sha256"]).lower(), \
                  f"{name}: {got[:12]} != manifest {str(meta['sha256'])[:12]}"
          print("jniLibs verified against manifest:", ", ".join(sorted(expect)))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: dsh-go-notara-apk
          path: ${{ steps.apk.outputs.name }}
          retention-days: 30
          compression-level: 0

      - name: Release
        if: github.event_name == 'workflow_dispatch' && inputs.create_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: notara-${{ github.run_number }}
          name: dsh-Go Notara 集成版 ${{ github.run_number }}
          body: |
            内置 Notara 教学引擎（白板 / 教室 / 课堂 / Vault）的 dsh-Go 安装包。

            - 架构：arm64-v8a（手机）
            - 签名：固定 release 密钥，可直接覆盖安装后续构建
            - Notara 提交：`${{ env.NOTARA_REF }}`
            - runtime：见构建日志里的 `runtimeVersion`
          files: ${{ steps.apk.outputs.name }}
          fail_on_unmatched_files: true
